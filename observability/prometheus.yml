global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: wormhole

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: wormhole
    metrics_path: /metrics
    static_configs:
      # The API runs on the host, so Prometheus reaches it through Docker's
      # host gateway. Change the port here if WORMHOLE_PORT is not 3000.
      - targets:
          - "host.docker.internal:3000"
        labels:
          component: api
